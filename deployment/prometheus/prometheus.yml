global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    service: orbit-field

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: orbit-api
    metrics_path: /metrics
    # Compose DNS resolves this to every API replica, so each is scraped.
    dns_sd_configs:
      - names: [api]
        type: A
        port: 4000
