name: orbit-field

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbit_dev_password}
      POSTGRES_DB: orbit_field
      # Deterministic collation: an ICU change between minor versions can
      # silently invalidate text indexes on upgrade.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=en-US --encoding=UTF8'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orbit -d orbit_field']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    command:
      - postgres
      # A sync push is many small transactions; these are tuned for that shape
      # rather than for analytical scans.
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - random_page_cost=1.1
      - -c
      - log_min_duration_statement=500

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    # Redis holds only rate-limit counters and locks, all reconstructible, so
    # persistence is a convenience rather than a durability requirement.
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-orbitadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-orbitadmin_dev_secret}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-orbitadmin} ${S3_SECRET_ACCESS_KEY:-orbitadmin_dev_secret};
      mc mb --ignore-existing local/orbit-attachments;
      mc mb --ignore-existing local/orbit-reports;
      mc anonymous set none local/orbit-attachments;
      exit 0;
      "

  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DATABASE_URL: postgresql://orbit:${POSTGRES_PASSWORD:-orbit_dev_password}@postgres:5432/orbit_field?schema=public&connection_limit=20
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      OTP_SECRET: ${OTP_SECRET}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: orbit-attachments
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-orbitadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-orbitadmin_dev_secret}
      S3_FORCE_PATH_STYLE: 'true'
      TRUST_PROXY: 'true'
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - '${BACKEND_PORT:-4000}:4000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
  redis-data:
  minio-data:
