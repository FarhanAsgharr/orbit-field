// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '35.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '24')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '35')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '34')
        kotlinVersion = findProperty('android.kotlinVersion') ?: '1.9.25'

        ndkVersion = "26.1.10909125"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle')
        classpath('com.facebook.react:react-native-gradle-plugin')
        classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    }

    /**
     * Pin the Kotlin compiler to `kotlinVersion` above.
     *
     * None of the classpath entries name a version — they are resolved through
     * the React Native Gradle plugin, which brings Kotlin 1.9.24. But
     * expo-modules-core compiles with Compose Compiler 1.5.15, which requires
     * exactly 1.9.25 and fails the build rather than warning:
     *
     *   e: This version (1.5.15) of the Compose Compiler requires Kotlin
     *      version 1.9.25 but you appear to be using Kotlin version 1.9.24
     *
     * `ext.kotlinVersion` already declares 1.9.25 and modules read it, but ext
     * does not influence what the buildscript itself resolves, so the compiler
     * that actually ran was still 1.9.24. Forcing it here makes the declared
     * version the effective one. A 1.9.24 -> 1.9.25 patch bump, not a jump.
     */
    configurations.classpath {
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}"
            force "org.jetbrains.kotlin:kotlin-compiler-embeddable:${kotlinVersion}"
            force "org.jetbrains.kotlin:kotlin-stdlib:${kotlinVersion}"
            force "org.jetbrains.kotlin:kotlin-reflect:${kotlinVersion}"
        }
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url(new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), '../android'))
        }
        maven {
            // Android JSC is installed from npm
            url(new File(['node', '--print', "require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), '../dist'))
        }

        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}
